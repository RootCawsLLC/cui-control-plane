name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Validate the control inventory
        run: npm run validate

      - name: Coverage report
        run: npm run coverage

      # The refusal is a feature and is asserted here rather than trusted. If this step ever
      # succeeds, somebody populated the SPRS weights without verifying them, or removed the guard.
      - name: SPRS refuses to score against unpopulated weights
        run: |
          if node src/cli.mjs sprs --weights reference/sprs-weights.yaml; then
            echo "::error::the SPRS scorer produced a score from unverified weights"
            exit 1
          fi
          echo "refusal confirmed"

      - name: Emit OSCAL O1-O5
        run: npm run emit

      # Byte-stability is the property the deterministic v5 UUIDs exist to create. Asserted on
      # every run, because it is the kind of thing a single Date.now() silently destroys.
      - name: Artifacts re-export byte-identically
        run: |
          cp -r out out.first
          node src/cli.mjs emit all --out out
          diff -r out.first out
          echo "byte-stable"

      # Generated reference files are generated. A hand edit to the requirement index is how a
      # wrong identifier gets in and stays in.
      - name: Generated reference files match their generator
        run: |
          node scripts/gen-requirement-index.mjs
          git diff --exit-code -- reference/ fixtures/sprs-weights.fixture.yaml

  # Schema conformance is checked by NIST's own oscal-cli, not asserted in a README. The `oscal`
  # npm package bootstraps the real Java CLI from Maven Central; it needs a JDK, hence setup-java.
  #
  # NOTHING HERE IS PIPED THROUGH `|| true`. An earlier version of this job did that against a
  # package name that does not exist on npm, and reported green while validating nothing - which is
  # the precise failure mode this repository exists to argue against. A check that cannot fail is
  # decoration. The job carries continue-on-error so a schema gap does not block the emitters being
  # tested above, but the step itself runs for real and its log shows the actual result.
  oscal-validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run emit

      - name: Validate against the OSCAL schemas
        run: |
          for f in catalog component-definition assessment-results poam ssp; do
            echo "::group::oscal validate out/oscal-$f.json"
            npx --yes oscal@2.0.7 validate --file "out/oscal-$f.json"
            echo "::endgroup::"
          done

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Unit tests
        run: npm test

      # The clone-and-run guarantee. If this breaks, a new analyst's first command fails and they
      # never get to anything else.
      - name: Pipeline runs end to end on bundled fixtures
        run: |
          npm run pipeline | tee /tmp/pipeline.txt
          grep -q "WITHHELD" /tmp/pipeline.txt

      - name: Doctor reports without crashing
        run: npm run doctor

      - name: Validate the control inventory
        run: npm run validate

      - name: Coverage report
        run: npm run coverage

      - name: Variance report
        run: npm run variance

      # The refusal is a feature and is asserted here rather than trusted. If this step ever
      # succeeds, somebody populated the SPRS weights without verifying them, or removed the guard.
      - name: SPRS refuses to score against unpopulated weights
        run: |
          if node src/cli.mjs sprs --weights reference/sprs-weights.yaml; then
            echo "::error::the SPRS scorer produced a score from unverified weights"
            exit 1
          fi
          echo "refusal confirmed"

      # Both of these refusals are features, asserted rather than trusted - same pattern as the
      # SPRS gate above. If either ever succeeds, a control started operating or the 889 population
      # came clean, and the expectation here needs updating deliberately.
      - name: Policy generation refuses while no control is operating
        run: |
          npm run policy | tee /tmp/policy.txt
          grep -q "that is the correct result" /tmp/policy.txt

      - name: Section 889 refuses to represent over an unresolved population
        run: |
          if npm run representation:889; then
            echo "::error::an affirmative 889 representation was drafted over failing components"
            exit 1
          fi
          echo "refusal confirmed"

      - name: Emit OSCAL O1-O5
        run: npm run emit

      # Byte-stability is the property the deterministic v5 UUIDs exist to create. Asserted on
      # every run, because it is the kind of thing a single Date.now() silently destroys.
      - name: Artifacts re-export byte-identically
        run: |
          cp -r out out.first
          node src/cli.mjs emit all --out out
          diff -r out.first out
          echo "byte-stable"

      # Generated reference files are generated. A hand edit to the requirement index is how a
      # wrong identifier gets in and stays in.
      - name: Generated reference files match their generator
        run: |
          node scripts/gen-requirement-index.mjs
          git diff --exit-code -- reference/ fixtures/sprs-weights.fixture.yaml

  # Schema conformance is checked by NIST's own oscal-cli, not asserted in a README. The `oscal`
  # npm package bootstraps the real Java CLI from Maven Central; it needs a JDK, hence setup-java.
  #
  # BLOCKING, and nothing is piped through `|| true` except the bootstrap step, whose file is
  # validated again for real below. An earlier version of this job ran `|| true` against a package
  # name that does not even exist on npm and reported green while validating nothing - the precise
  # failure mode this repository exists to argue against. All eight artifacts validate clean today,
  # so this gate can fail the build, and a regression in any emitter now stops a merge.
  oscal-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run emit

      # The npm wrapper downloads the Java CLI on first use and exits WITHOUT validating that
      # first file - so whichever document came first in the loop silently produced no result.
      # This step absorbs the bootstrap; every file including this one is then validated for real
      # below, so the `|| true` here hides nothing.
      - name: Bootstrap NIST oscal-cli
        run: npx --yes oscal@2.0.7 validate --file out/oscal-catalog.json || true

      - name: Validate against the OSCAL schemas
        run: |
          for f in catalog profile-cmmc-l2 profile-scrm component-definition \
                   assessment-plan assessment-results poam ssp; do
            echo "::group::oscal validate out/oscal-$f.json"
            npx --yes oscal@2.0.7 validate --file "out/oscal-$f.json"
            echo "::endgroup::"
          done
